[project]
name = "netdoc-collector"
description = "Network Documentation Platform - Collector"
version = "0.2.1"
authors = [
    {name = "Andrea Cavazzini",email = "cavazzini.andrea@gmail.com"},
    {name = "Andrea Dainese",email = "andrea.dainese@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "netmiko (>=4.6.0,<5.0.0)",
    "nornir (>=3.5.0,<4.0.0)",
    "nornir-netmiko (>=1.0.1,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "textfsm (>=2.1.0,<3.0.0)",
    "websockets (>=16.0,<17.0)"
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<3.14"


[project.urls]
homepage = "https://github.com/NetDocLab/netdoc-collector"
documentation = "https://github.com/NetDocLab/netdoc-collector/wiki"
repository = "https://github.com/NetDocLab/netdoc-collector/releases"
issues = "https://github.com/NetDocLab/netdoc-collector/issues"


# ---------------------------------------------------------------------------
# Build system
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
netdoc-collector = "netdoc_collector.main:entrypoint"


# ---------------------------------------------------------------------------
# Poetry
# ---------------------------------------------------------------------------

[tool.poetry]
name = "netdoc-collector"
packages = [
    {include = "netdoc_collector", from = "src"}
]


[tool.poetry.group.dev.dependencies]
# Testing (unit tests)
factory-boy = ">=3.3"
faker = ">=20.0"
hypothesis = ">=6.90"
pre-commit = "^4.5.1"
pytest = ">=7.4"
pytest-asyncio = "^1.3.0"
pytest-cov = ">=4.1"

# Testing (integration tests)
pytest-django = "^4.12.0"
djangorestframework = ">=3.14,<4.0"
netdoc = {path = "../netdoc", develop = true}
netdoc-sdk = {path = "../netdoc-sdk", develop = true}

# Code quality
mypy = ">=1.7"
ruff = ">=0.1"

# Development tools
ipython = ">=8.18"
watchdog = ">=3.0"

# Documentation
mkdocs = ">=1.5"
mkdocs-material = ">=9.5"
mkdocstrings = {version = ">=0.24", extras = ["python"]}


# ---------------------------------------------------------------------------
# Bandit — security linter
# ---------------------------------------------------------------------------

[tool.bandit]
# Scan only the production package, not tests.
# Tests use assert statements (B101) and may import test-only modules.
exclude_dirs = ["tests", "docs"]

# B101: assert used — expected in tests (already excluded above, belt-and-suspenders)
# B404: import subprocess — common and not inherently unsafe in an SDK
# B603: subprocess without shell=True — safe, explicit args list
skips = ["B101", "B404", "B603"]

# Minimum severity and confidence to report (LOW / MEDIUM / HIGH)
# MEDIUM/MEDIUM avoids noise from low-confidence findings
severity = "MEDIUM"
confidence = "MEDIUM"


# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["netdoc_collector"]
omit = [
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
# Strict extras — enable incrementally as the codebase matures:
# strict = true


# ---------------------------------------------------------------------------
# pyright — kept off as mypy is the primary type checker
# ---------------------------------------------------------------------------

[tool.pyright]
typeCheckingMode = "off"


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netdoc.settings.test"
minversion = "7.0"
addopts = "-v -ra --strict-markers --strict-config --cov=netdoc_sdk --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]
python_classes = ["Test*"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"


# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "__pycache__",
    ".git",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "env",
    "migrations",
    "venv",
]

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "ARG",  # flake8-unused-arguments
    "TCH",  # flake8-type-checking (moves TYPE_CHECKING imports correctly)
    "RUF",  # ruff-specific rules
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex — address gradually
    "E501",  # line too long — handled by ruff format
    "ARG001", # unused function argument — common in abstract/protocol methods
]

[tool.ruff.lint.isort]
known-first-party = ["netdoc_sdk"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002"]
"tests/factories.py" = ["F401"]
