name: Tests (CI)
env:
  PYTHON_VERSION: 3.12
  DB_NAME: netdoc_db
  DB_USERNAME: netdoc_user
  DB_PASSWORD: netdoc_pass
  DB_HOST: localhost
  DJANGO_ALLOWED_HOSTS: '*'
  DJANGO_SECRET_KEY: django-insecure-CHANGE-ME-IN-PRODUCTION
  DJANGO_ENCRYPTION_KEY: django-insecure-CHANGE-ME-IN-PRODUCTION-ERR=
  CELERY_BROKER_URL: not-used-in-tests
  SECURE_SSL_REDIRECT: false
on:
  pull_request:
    types: [opened, synchronize, reopened]
# Cancel any existing runs of this workflow for this same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    if: "${{ !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}"
    runs-on: ubuntu-latest
    steps:
      - name: "Updating APT cache"
        run: "sudo apt-get update"
      - name: "Installing PostgreSQL, Redis"
        run: "sudo apt-get install -y postgresql redis"
      - name: "Starting Redis"
        run: "sudo systemctl start redis-server"
      - name: "Starting PostgreSQL"
        run: "sudo systemctl start postgresql"
      - name: "Adding PostgreSQL database"
        run: "sudo su - postgres -c 'psql -c \"create database ${{ env.DB_NAME }}\"'"
      - name: "Adding PostgreSQL username"
        run: sudo su - postgres -c "psql -c \"create user ${{ env.DB_USERNAME }} with password '${{ env.DB_PASSWORD }}'\""
      - name: "Setting PostgreSQL database privileges"
        run: "sudo su - postgres -c 'psql -c \"grant all privileges on database ${{ env.DB_NAME }} to ${{ env.DB_USERNAME }}\"'"
      - name: "Setting PostgreSQL administrative privileges"
        run: "sudo su - postgres -c 'psql -c \"alter user ${{ env.DB_USERNAME }} createdb\"'"
      - name: Checkout (collector)
        uses: actions/checkout@v6
        with:
          path: netdoc-collector
      - name: Checkout (backend)
        uses: actions/checkout@v6
        with:
          repository: NetDocLab/netdoc
          path: netdoc
          # User -> Settings -> Developer Settings -> Personal Access Token (Permission -> Content
          token: ${{ secrets.NETDOC_REPO_TOKEN }}
      - name: Checkout (SDK)
        uses: actions/checkout@v6
        with:
          repository: NetDocLab/netdoc-sdk
          path: netdoc-sdk
          # User -> Settings -> Developer Settings -> Personal Access Token (Permission -> Content
          token: ${{ secrets.NETDOC_SDK_REPO_TOKEN }}
      - name: Setup Python3
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install --no-cache-dir poetry
      - name: Display Poetry version
        run: poetry --version
      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true
      - name: Install collector
        run: make install
        working-directory: netdoc-collector
      - name: Validate collector documentation build
        run: poetry run mkdocs build --strict
        working-directory: netdoc-collector
      - name: Code linting on collector (make lint)
        run: make lint
        working-directory: netdoc-collector
      - name: Run checks on collector (pre-commit)
        run: make check
        working-directory: netdoc-collector
      - name: Run tests on collector (make coverage)
        run: make coverage
        working-directory: netdoc-collector
      - name: Test build process
        run: poetry build
        working-directory: netdoc-collector
  snyk:
    if: "${{ !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}"
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Snyk
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
